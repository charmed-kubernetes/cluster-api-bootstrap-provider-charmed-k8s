name: Integration Tests
on: [pull_request]

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
    - name: Setup env
      run: test/integration/setup-env.sh
    - name: Run tests
      run: test/integration/run.sh
